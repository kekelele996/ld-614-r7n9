spring.application.name=quality-trace
server.port=8080

# 当前版本数据访问为内存存储（与骨架架构一致），排除数据源/JPA/MyBatis 自动装配，
# 保证在数据库不可达时服务仍可启动；database/init.sql 维护等价的表结构与种子数据。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
